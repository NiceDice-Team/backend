[pytest]

DJANGO_SETTINGS_MODULE = src.test_settings
pythonpath = src
python_files = tests.py test_*.py *_tests.py
addopts = --strict-markers

markers =
    unit: isolated logic without database, HTTP, or external services
    component: Django component behavior, optionally using the test database
    api: HTTP contract behavior exercised through Django or DRF test clients
    bug: reproduces or characterizes a confirmed current product defect (not a test layer)
    django_db: use the django test database
