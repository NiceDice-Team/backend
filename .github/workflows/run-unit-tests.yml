# .github/workflows/run-unit-tests.yml
name: Run Django Unit Tests

on:
  pull_request:
    branches:
      - main
      - unit_tests_user_app

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: src.test_settings
      PYTHONUNBUFFERED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: |
          python manage.py migrate

      - name: Run pytest with coverage
        run: |
          pytest --maxfail=1 --disable-warnings -v \
            --cov=src --cov-report=term-missing --cov-report=xml --cov-report=html \
            --junitxml=pytest-results.xml \
            2>&1 | tee pytest-output.txt

      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            pytest-output.txt
            coverage.xml
            htmlcov/**

      - name: Build pytest summary for MR
        if: always()
        shell: bash
        run: |
          {
            echo "### Pytest Summary"
            echo
            SUMMARY_LINE=$(grep -E "=+ .* in .* =+" pytest-output.txt | tail -1 || true)
            if [ -n "$SUMMARY_LINE" ]; then
              echo "- ${SUMMARY_LINE}"
            else
              echo "- Could not extract pytest summary line."
            fi
            WARNINGS=$(grep -c "warning" pytest-output.txt || true)
            echo "- Warning mentions in log: ${WARNINGS}"
            echo
            echo "Artifacts: \\`pytest-results\\`"
          } > pytest-summary.md

      - name: Comment pytest summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pytest-summary.md', 'utf8');
            const marker = '<!-- pytest-summary-comment -->';
            const finalBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: finalBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: finalBody,
              });
            }
