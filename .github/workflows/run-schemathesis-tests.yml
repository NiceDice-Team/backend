# .github/workflows/run-schemathesis-tests.yml
name: Run Schemathesis API Tests
on:
  pull_request:
    branches:
      - main
      - unit_tests_user_app

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SCHEMATHESIS_BASE_URL: http://localhost:8000
      SCHEMATHESIS_API_SCHEMA_PATH: api/schema/
      PYTHONUNBUFFERED: 1
      DB_USER: backend_user
      DB_PASSWORD: backend_pass
      DB_NAME: backend_db
      DB_HOST: localhost
      DB_PORT: 5432
      DB_SSLMODE: disable
      DJANGO_SETTINGS_MODULE: src.contract_settings
      CONTRACT_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      CONTRACT_EMAIL_HOST: localhost
      CONTRACT_EMAIL_PORT: 1025
      CONTRACT_USE_POSTGRES: 1
      CONTRACT_EGRESS_GUARD: 1
      CONTRACT_ALLOWED_LOCAL_HOSTS: postgres,mailcatcher
      CONTRACT_REPORT_DIR: schemathesis-report
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_SESSION_TOKEN: ''
      STRIPE_SECRET_KEY: ''
      GOOGLE_OAUTH2_CLIENT_ID: ''
      GOOGLE_OAUTH2_CLIENT_SECRET: ''
      FACEBOOK_APP_ID: ''
      FACEBOOK_APP_SECRET: ''
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: backend_user
          POSTGRES_PASSWORD: backend_pass
          POSTGRES_DB: backend_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend_user -d backend_db" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
      mailcatcher:
        image: schickling/mailcatcher
        ports:
          - 1025:1025
          - 1080:1080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run contract inventory
        run: pytest -m contract -q -p no:cacheprovider
      - name: Run local-only contract gate against fresh PostgreSQL
        run: bash tests/contract/run_contract.sh
        timeout-minutes: 10
      - name: Upload Schemathesis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: schemathesis-report/
